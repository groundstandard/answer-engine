version: "3.9"

services:
  db-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: answer_engine_test
      POSTGRES_USER: ae_user
      POSTGRES_PASSWORD: ae_password
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
